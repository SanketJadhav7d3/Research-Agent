[project]
name = "research-agent-backend"
version = "0.1.0"
description = "Agentic research assistant — FastAPI + LangGraph backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "langchain[google-genai,openai,anthropic]>=0.3",
    "tavily-python>=0.5",
    "httpx>=0.27",
]

[tool.uv]
package = false
