services:
  backend:
    build: ./backend
    ports:
      # Host port 8000 — 8080 is commonly taken (Jenkins, Tomcat, etc).
      # The container still listens on 8080, so the frontend proxy is unaffected.
      - "8000:8080"
    env_file: .env
    volumes:
      - ./backend:/app
      # Masks the bind mount so the image's venv survives; without this the
      # host directory shadows /app/.venv and the container loses its deps.
      - /app/.venv
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
